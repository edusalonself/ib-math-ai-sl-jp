# ══════════════════════════════════════════════════════════
#  下書きプロファイル
#
#  まだ書きかけで、オンラインに出さないコースをここに置きます。
#
#    quarto preview --profile draft   … 書きかけも見える
#    quarto preview                   … 公開するものだけ
#
#  ★ このファイルの中身は、_quarto.yml の【後ろに足されます】。
#     _quarto.yml はさわらなくて構いません。
#
#  ★ そのコースを公開する段になったら、ここの navbar 項目と
#     sidebar のかたまりを切り取って、_quarto.yml の該当箇所に
#     貼ってください。
#
#  ★ 2026年10月：AA HL（35ページ）を書き終えたので、_quarto.yml へ
#     移しました。いま下書きのコースはありません。
#     AI SL・AI HL・AA SL・AA HL は、すべて _quarto.yml に入っています。
#     次に新しいコースを書き始めるときは、ここに
#       project: render: / website: navbar: / website: sidebar:
#     の 3 か所を足してください（書き方は _quarto.yml と同じです）。
# ══════════════════════════════════════════════════════════

website:
  # ★ 下書きの preview は localhost です。そのアクセスが Google
  #    アナリティクスに混ざらないよう、ここでは測定 ID を空にします。
  #    （_quarto.yml の google-analytics を上書きしています。）
  google-analytics: ""
