# ══════════════════════════════════════════════════════════
#  下書きプロファイル
#
#  まだ書きかけで、オンラインに出さないコースをここに置きます。
#
#    quarto preview --profile draft   … 書きかけも見える
#    quarto preview                   … 公開するものだけ
#
#  ★ このファイルの中身は、_quarto.yml の【後ろに足されます】。
#     _quarto.yml はさわらなくて構いません。
#
#  ★ そのコースを公開する段になったら、ここの navbar 項目と
#     sidebar のかたまりを切り取って、_quarto.yml の該当箇所に
#     貼ってください。
#
#  ★ AI SL（39項目）は書き上がっているので、もうここにはありません。
#     _quarto.yml に入っています。ただし公開は手作業です
#     （PUBLISH.md を見てください）。
# ══════════════════════════════════════════════════════════

# ★ ビルド対象にも足しておくこと。_quarto.yml の render に
#    書いていないファイルは、HTML すら作られません。
project:
  render:
    - which-course.qmd
    - ai-hl/index.qmd
    - ai-hl/**/*.qmd
    - aa-sl/index.qmd
    - aa-sl/**/*.qmd
    - aa-hl/index.qmd
    - aa-hl/**/*.qmd

website:
  navbar:
    left:
      - text: "AI HL"
        href: ai-hl/index.qmd
      - text: "AA SL"
        href: aa-sl/index.qmd
      - text: "AA HL"
        href: aa-hl/index.qmd
      - text: "AI と AA、どちらを取るか"
        href: which-course.qmd

  sidebar:
    - id: ai-hl
      title: "IB数学 AI HL"
      style: docked
      collapse-level: 1
      contents:
        - ai-hl/index.qmd

        # 書き上がった項目から、ここに足していきます。
        - section: "Topic 1 — Number and algebra"
          contents:
            - file: ai-hl/01-number-and-algebra/ahl-1-14.qmd
              text: "AHL 1.14 — Matrices"
            - file: ai-hl/01-number-and-algebra/ahl-1-15.qmd
              text: "AHL 1.15 — Eigenvalues and eigenvectors"

        - section: "Topic 3 — Geometry and trigonometry"
          contents:
            - file: ai-hl/03-geometry-and-trigonometry/ahl-3-9.qmd
              text: "AHL 3.9 — Geometric transformations in two dimensions"
            - file: ai-hl/03-geometry-and-trigonometry/ahl-3-14.qmd
              text: "AHL 3.14 — Graph theory"
            - file: ai-hl/03-geometry-and-trigonometry/ahl-3-15.qmd
              text: "AHL 3.15 — Adjacency matrices"
            - file: ai-hl/03-geometry-and-trigonometry/ahl-3-16.qmd
              text: "AHL 3.16 — Tree and cycle algorithms"

        - section: "Topic 4 — Statistics and probability"
          contents:
            - file: ai-hl/04-statistics-and-probability/ahl-4-19.qmd
              text: "AHL 4.19 — Transition matrices"

    - id: aa-sl
      title: "IB数学 AA SL"
      style: docked
      collapse-level: 1
      contents:
        - aa-sl/index.qmd

    - id: aa-hl
      title: "IB数学 AA HL"
      style: docked
      collapse-level: 1
      contents:
        - aa-hl/index.qmd
