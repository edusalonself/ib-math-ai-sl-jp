# ★ ビルド対象にも足しておくこと。_quarto.yml の render に
#    書いていないファイルは、HTML すら作られません。
project:
  render:
    - which-course.qmd
    - glossary-aa.qmd
    - aa-sl/index.qmd
    - aa-sl/**/*.qmd
    - aa-hl/index.qmd
    - aa-hl/**/*.qmd

website:
