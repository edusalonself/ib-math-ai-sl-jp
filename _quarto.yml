crossref:
  # false にしておくこと。true だと「Example 17.1」のように
  # ページの通し番号が頭に付き、シラバス番号と紛らわしくなる。
  chapters: false
  thm-title: 定理
  def-title: 定義
  exm-title: 例題
  cor-title: 系

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-title: このページの内容
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    fig-align: center
    link-external-newwindow: true

