# ══════════════════════════════════════════════════════════
#  日本語で読む IB数学 — サイト全体の設定
#
#  ★ 2026年8月、book から website に変えました。
#     book はサイドバーを1本しか持てないため、AI SL・AI HL・
#     AA SL・AA HL の4コースを並べられません。
#     website なら、コースごとにサイドバーを分けられます。
#
#    quarto preview                   … 公開するものだけ
#    quarto preview --profile draft   … 執筆中のコースも見える
#
#  ★ 公開はいつも手作業です。勝手に公開されることはありません。
#     手順は PUBLISH.md を見てください。
# ══════════════════════════════════════════════════════════

project:
  type: website
  output-dir: _site

  # ── 何をビルドするか ────────────────────────────────────
  #  ここに書いたものだけが出力されます。書きかけのコースは
  #  _quarto-draft.yml 側で足しているので、profile を付けずに
  #  ビルドしても【HTML すら作られません】。
  #  ★ サイドバーから消すだけでは、ファイルは公開されてしまいます。
  #     消したいものは、必ずこのリストからも外してください。
  # ────────────────────────────────────────────────────────
  render:
    - index.qmd
    - glossary-ai.qmd
    - ai-sl/index.qmd
    - ai-sl/**/*.qmd
    - "!ai-sl/appendix-gdc.qmd"   # 中身ができたら、この行を消す

lang: ja

website:
  title: "日本語で読む IB数学"
  # ★ 公開先の URL。sitemap.xml と検索エンジン向けの canonical に使われます。
  #    独自ドメイン（math.selfsg.com）に切り替えたら、ここも書き換えること。
  site-url: https://edusalonself.github.io/ib-math-ai-sl-jp/
  search:
    location: navbar
    type: overlay
  page-navigation: true

  navbar:
    left:
      - text: "AI SL"
        href: ai-sl/index.qmd
      - text: "英日対訳表（AI）"
        href: glossary-ai.qmd
    right:
      - text: "学習サロン SELF"
        href: https://www.selfsg.com/

  # ── サイドバー ──────────────────────────────────────────
  #  コースごとに1本。id を付けておくと、ページの front matter に
  #    sidebar: ai-sl
  #  と書いて明示的に指定することもできます。
  # ────────────────────────────────────────────────────────
  sidebar:
    - id: ai-sl
      title: "IB数学 AI SL"
      style: docked
      collapse-level: 1
      contents:
        - ai-sl/index.qmd

        - section: "Topic 1 — Number and algebra"
          contents:
            - file: ai-sl/01-number-and-algebra/sl-1-1.qmd
              text: "SL 1.1 — Numbers in standard form"
            - file: ai-sl/01-number-and-algebra/sl-1-2.qmd
              text: "SL 1.2 — Arithmetic sequences and series"
            - file: ai-sl/01-number-and-algebra/sl-1-3.qmd
              text: "SL 1.3 — Geometric sequences and series"
            - file: ai-sl/01-number-and-algebra/sl-1-4.qmd
              text: "SL 1.4 — Compound interest and depreciation"
            - file: ai-sl/01-number-and-algebra/sl-1-5.qmd
              text: "SL 1.5 — Exponents and logarithms"
            - file: ai-sl/01-number-and-algebra/sl-1-6.qmd
              text: "SL 1.6 — Approximation and percentage error"
            - file: ai-sl/01-number-and-algebra/sl-1-7.qmd
              text: "SL 1.7 — Amortization and annuities"
            - file: ai-sl/01-number-and-algebra/sl-1-8.qmd
              text: "SL 1.8 — Solving equations with technology"

        - section: "Topic 2 — Functions"
          contents:
            - file: ai-sl/02-functions/sl-2-1.qmd
              text: "SL 2.1 — Equations of a straight line"
            - file: ai-sl/02-functions/sl-2-2.qmd
              text: "SL 2.2 — Functions, domain, range and inverse functions"
            - file: ai-sl/02-functions/sl-2-3.qmd
              text: "SL 2.3 — Graphs of functions"
            - file: ai-sl/02-functions/sl-2-4.qmd
              text: "SL 2.4 — Key features of graphs"
            - file: ai-sl/02-functions/sl-2-5.qmd
              text: "SL 2.5 — Modelling with functions"
            - file: ai-sl/02-functions/sl-2-6.qmd
              text: "SL 2.6 — The modelling process"

        - section: "Topic 3 — Geometry and trigonometry"
          contents:
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-1.qmd
              text: "SL 3.1 — Three-dimensional geometry"
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-2.qmd
              text: "SL 3.2 — Trigonometric ratios, sine and cosine rules"
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-3.qmd
              text: "SL 3.3 — Applications: bearings, elevation and depression"
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-4.qmd
              text: "SL 3.4 — The circle: length of an arc, area of a sector"
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-5.qmd
              text: "SL 3.5 — Equations of perpendicular bisectors"
            - file: ai-sl/03-geometry-and-trigonometry/sl-3-6.qmd
              text: "SL 3.6 — Voronoi diagrams"

        - section: "Topic 4 — Statistics and probability"
          contents:
            - file: ai-sl/04-statistics-and-probability/sl-4-1.qmd
              text: "SL 4.1 — Sampling, bias and outliers"
            - file: ai-sl/04-statistics-and-probability/sl-4-2.qmd
              text: "SL 4.2 — Presentation of data"
            - file: ai-sl/04-statistics-and-probability/sl-4-3.qmd
              text: "SL 4.3 — Measures of central tendency and dispersion"
            - file: ai-sl/04-statistics-and-probability/sl-4-4.qmd
              text: "SL 4.4 — Correlation and linear regression"
            - file: ai-sl/04-statistics-and-probability/sl-4-5.qmd
              text: "SL 4.5 — Introduction to probability"
            - file: ai-sl/04-statistics-and-probability/sl-4-6.qmd
              text: "SL 4.6 — Combined events and conditional probability"
            - file: ai-sl/04-statistics-and-probability/sl-4-7.qmd
              text: "SL 4.7 — Discrete random variables and expected value"
            - file: ai-sl/04-statistics-and-probability/sl-4-8.qmd
              text: "SL 4.8 — The binomial distribution"
            - file: ai-sl/04-statistics-and-probability/sl-4-9.qmd
              text: "SL 4.9 — The normal distribution"
            - file: ai-sl/04-statistics-and-probability/sl-4-10.qmd
              text: "SL 4.10 — Spearman's rank correlation coefficient"
            - file: ai-sl/04-statistics-and-probability/sl-4-11.qmd
              text: "SL 4.11 — Hypothesis testing: χ² and t-tests"

        - section: "Topic 5 — Calculus"
          contents:
            - file: ai-sl/05-calculus/sl-5-1.qmd
              text: "SL 5.1 — Introduction to limits and the derivative"
            - file: ai-sl/05-calculus/sl-5-2.qmd
              text: "SL 5.2 — Increasing and decreasing functions"
            - file: ai-sl/05-calculus/sl-5-3.qmd
              text: "SL 5.3 — Differentiation"
            - file: ai-sl/05-calculus/sl-5-4.qmd
              text: "SL 5.4 — Tangents and normals"
            - file: ai-sl/05-calculus/sl-5-5.qmd
              text: "SL 5.5 — Introduction to integration"
            - file: ai-sl/05-calculus/sl-5-6.qmd
              text: "SL 5.6 — Local maxima and minima"
            - file: ai-sl/05-calculus/sl-5-7.qmd
              text: "SL 5.7 — Optimisation"
            - file: ai-sl/05-calculus/sl-5-8.qmd
              text: "SL 5.8 — The trapezoidal rule"

        - section: "付録"
          contents:
            - file: glossary-ai.qmd
              text: "英日対訳表（AI）"
            # - file: ai-sl/appendix-gdc.qmd
            #   text: "試験でのGDC"        # 中身ができたら戻す

  page-footer:
    left: "© 2026 学習サロン SELF"
    center:
      - text: "学習サロン SELF"
        href: https://www.selfsg.com/
    right: "IB（国際バカロレア機構）とは関係のない独立した教材です"

crossref:
  # false にしておくこと。true だと「Example 17.1」のように
  # ページの通し番号が頭に付き、シラバス番号と紛らわしくなる。
  chapters: false
  thm-title: 定理
  def-title: 定義
  exm-title: 例題
  cor-title: 系

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-title: このページの内容
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    fig-align: center
    link-external-newwindow: true
