project:
  type: book
  output-dir: _book

lang: ja

book:
  title: "IB数学 AI SL"
  subtitle: "日本語で読む Applications and Interpretation Standard Level"
  author: "学習サロン SELF"
  date: today
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "© 2026 学習サロン SELF"
    center:
      - text: "学習サロン SELF"
        href: https://www.selfsg.com/
    right: "IB（国際バカロレア機構）とは関係のない独立した教材です"

  chapters:
    - index.qmd

    - part: "Topic 1 — Number and algebra"
      chapters:
        - file: 01-number-and-algebra/sl-1-1.qmd
          text: "SL 1.1 — Numbers in standard form"
        - file: 01-number-and-algebra/sl-1-2.qmd
          text: "SL 1.2 — Arithmetic sequences and series"
        - file: 01-number-and-algebra/sl-1-3.qmd
          text: "SL 1.3 — Geometric sequences and series"
        - file: 01-number-and-algebra/sl-1-4.qmd
          text: "SL 1.4 — Compound interest and depreciation"
        - file: 01-number-and-algebra/sl-1-5.qmd
          text: "SL 1.5 — Exponents and logarithms"
        - file: 01-number-and-algebra/sl-1-6.qmd
          text: "SL 1.6 — Approximation and percentage error"
        - file: 01-number-and-algebra/sl-1-7.qmd
          text: "SL 1.7 — Amortization and annuities"
        - file: 01-number-and-algebra/sl-1-8.qmd
          text: "SL 1.8 — Solving equations with technology"

    # ══════════════════════════════════════════════════════
    #  Topic 2 以降は _quarto-draft.yml に置いてあります。
    #
    #    quarto preview --profile draft  … 全部見える（執筆用）
    #    quarto preview                  … 公開されるものだけ
    #    quarto publish gh-pages         … 公開されるものだけ
    #
    #  ★ 公開する段になったら、_quarto-draft.yml から
    #     その part を切り取って、ここに貼ってください。
    #     index.qmd の「いまは執筆中です」の直しも忘れずに。
    # ══════════════════════════════════════════════════════

  appendices:
    # - appendix-gdc.qmd     # 中身ができたら戻す
    - appendix-terms.qmd

crossref:
  # false にしておくこと。true だと「Example 17.1」のように
  # ページの通し番号が頭に付き、シラバス番号と紛らわしくなる。
  chapters: false
  thm-title: 定理
  def-title: 定義
  exm-title: 例題
  cor-title: 系

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-title: このページの内容
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    fig-align: center
    link-external-newwindow: true

  # ── 日本語 PDF を出す場合は、下の3行のコメントを外す（lualatex が必要）──
  # ★ 有効にしたまま quarto publish すると、lualatex がない環境では止まります。
  # pdf:
  #     pdf-engine: lualatex
  #     documentclass: ltjsbook
  #     classoption: [a4paper]
  #     number-sections: false
  #     colorlinks: true
  #     include-in-header:
  #       text: |
  #         \usepackage{amsmath,amssymb,mathtools}
