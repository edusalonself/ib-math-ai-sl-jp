# ══════════════════════════════════════════════════════════
#  日本語で読む IB数学 — サイト全体の設定
#
#  ★ 2026年8月、book から website に変えました。
#     book はサイドバーを1本しか持てないため、AI SL・AI HL・
#     AA SL・AA HL の4コースを並べられません。
#     website なら、コースごとにサイドバーを分けられます。
#
#    quarto preview                   … 公開するものだけ
#    quarto preview --profile draft   … 執筆中のコースも見える
#
#  ★ 公開はいつも手作業です。勝手に公開されることはありません。
#     手順は PUBLISH.md を見てください。
# ══════════════════════════════════════════════════════════

project:
  type: website
  output-dir: _site

  # ── 何をビルドするか ────────────────────────────────────
  #  ここに書いたものだけが出力されます。書きかけのコースは
  #  _quarto-draft.yml 側で足しているので、profile を付けずに
  #  ビルドしても【HTML すら作られません】。
  #  ★ サイドバーから消すだけでは、ファイルは公開されてしまいます。
  #     消したいものは、必ずこのリストからも外してください。
  # ────────────────────────────────────────────────────────
  render:
    - index.qmd
    - glossary-ai.qmd
    - ai-sl/index.qmd
    - ai-sl/**/*.qmd
    - "!ai-sl/appendix-gdc.qmd"   # 中身ができたら、この行を消す
    - ai-hl/index.qmd
    - ai-hl/**/*.qmd

lang: ja

website:
  title: "日本語で読む IB数学"
  # ★ 公開先の URL。sitemap.xml と検索エンジン向けの canonical に使われます。
  #    独自ドメイン（math.selfsg.com）に切り替えたら、ここも書き換えること。
  site-url: https://edusalonself.github.io/ib-math-ai-sl-jp/

  # ── アクセス解析（Google アナリティクス GA4）─────────────
  #  ★ gtag のタグを自分で貼る必要はありません。この tracking-id を
  #     書いておけば、Quarto が全ページの <head> に入れてくれます。
  #  ★ 測定 ID を変えるときは、ここ1か所だけ直せば済みます。
  #  ・anonymize-ip は GA4 では既定で有効です（書いても害はありません）。
  #  ・下書きプロファイル（_quarto-draft.yml）では空にしてあるので、
  #    quarto preview --profile draft の localhost アクセスは
  #    集計に入りません。
  # ────────────────────────────────────────────────────────
  google-analytics:
    tracking-id: "G-LQBB7M9VZ0"
    version: 4
    anonymize-ip: true

  # ── Cookie 同意バナー ───────────────────────────────────
  #  implied … バナーは出るが、読者が操作しなくても計測は動く。
  #            express にすると「同意する」を押すまで計測しない。
  #  文言は lang: ja から自動で日本語になります。ただし既定の本文は
  #  「ターゲット広告」に触れていて、このサイトの実態と合わないので、
  #  cookie-text-ja.html で書きかえています（format の
  #  include-after-body を見てください）。
  # ────────────────────────────────────────────────────────
  cookie-consent:
    type: implied
    style: simple
    palette: light
    prefs-text: "Cookie の設定"

  search:
    location: navbar
    type: overlay
  page-navigation: true

  navbar:
    left:
      - text: "AI SL"
        href: ai-sl/index.qmd
      - text: "AI HL"
        href: ai-hl/index.qmd
      - text: "英日対訳表（AI）"
        href: glossary-ai.qmd
    right:
      - text: "学習サロン SELF"
        href: https://www.selfsg.com/

  # ── サイドバー ──────────────────────────────────────────
  #  コースごとに1本。id を付けておくと、ページの front matter に
  #    sidebar: ai-sl
  #  と書いて明示的に指定することもできます。
